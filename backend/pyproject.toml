[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocupabot"
version = "0.1.0"
description = "Bot de WhatsApp e painel web para agendamento em clínicas de saúde ocupacional"
license = { text = "MIT" }
requires-python = ">=3.11"
# Testado em 3.11 a 3.13. Versões novas demais (ex.: 3.15) podem não ter pacotes prontos no Windows.
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.1",
  "httpx>=0.27",
  "tzdata; sys_platform == 'win32'",  # o Windows não traz a base de fusos horários
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["ocupabot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migracoes/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
